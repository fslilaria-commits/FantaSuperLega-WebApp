name: Aggiorna dati SuperLega

# Ogni settimana scarica dal sito della Lega le proposte di listone, calendario e tabellini e le salva in data/.
# Non tocca il gioco: gli admin le applicano dal pannello Admin dell'app.
on:
  schedule:
    - cron: '0 5 * * 2' # martedì alle 5:00 UTC, dopo la giornata del weekend
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aggiorna-dati
  cancel-in-progress: false

jobs:
  dati:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codice
        uses: actions/checkout@v4

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend-bot/package-lock.json

      - name: Installa Dipendenze
        working-directory: backend-bot
        run: npm ci

      - name: Scarica la proposta di listone
        working-directory: backend-bot
        run: npm run genera-listone

      - name: Scarica la proposta di calendario
        working-directory: backend-bot
        run: npm run genera-calendario

      - name: Scarica i tabellini delle giornate concluse
        working-directory: backend-bot
        run: npm run genera-tabellini

      # Anche se uno dei passi precedenti si è fermato per un controllo, salva ciò che è stato scaricato bene
      - name: Salva le differenze, se ci sono
        if: always()
        run: |
          # status --porcelain vede anche i file nuovi (per esempio il tabellino di una nuova giornata)
          if [ -z "$(git status --porcelain -- data/)" ]; then
            echo "Nessuna novità nei dati della Lega." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git add data/
          git diff --cached --stat >> "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Dati aggiornati dal sito della Lega (listone, calendario, tabellini)"
          git push
          echo "Nuove proposte salvate: da applicare dal pannello Admin." >> "$GITHUB_STEP_SUMMARY"
