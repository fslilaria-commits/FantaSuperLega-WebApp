name: Aggiorna dati SuperLega

# Ogni settimana scarica dal sito della Lega le proposte di listone e calendario e le salva in data/.
# Non tocca il gioco: gli admin le applicano dal pannello Admin dell'app.
on:
  schedule:
    - cron: '0 5 * * 2' # martedì alle 5:00 UTC, dopo la giornata del weekend
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aggiorna-dati
  cancel-in-progress: false

jobs:
  dati:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codice
        uses: actions/checkout@v4

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend-bot/package-lock.json

      - name: Installa Dipendenze
        working-directory: backend-bot
        run: npm ci

      - name: Scarica la proposta di listone
        working-directory: backend-bot
        run: npm run genera-listone

      - name: Scarica la proposta di calendario
        working-directory: backend-bot
        run: npm run genera-calendario

      - name: Salva le differenze, se ci sono
        run: |
          if git diff --quiet -- data/; then
            echo "Nessuna novità in listone e calendario." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff --stat -- data/ >> "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Proposte di listone e calendario aggiornate dal sito della Lega"
          git push
          echo "Nuove proposte salvate: da applicare dal pannello Admin." >> "$GITHUB_STEP_SUMMARY"
