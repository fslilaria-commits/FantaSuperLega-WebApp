name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codice
        uses: actions/checkout@v5

      - name: Configura Java (richiesto dall'emulatore)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Configura Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend-bot/package-lock.json

      - name: Installa Dipendenze
        run: |
          npm ci
          npm ci --prefix backend-bot

      - name: Test della logica del pannello Admin
        run: npm run test:unit

      - name: Test del generatore del listone
        run: npm test --prefix backend-bot

      - name: Test delle regole Firestore
        run: npm run test:rules
