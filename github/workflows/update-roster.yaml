name: Auto-Update Roster SuperLega

on:
  schedule:
    - cron: '0 3 * * 2'
  workflow_dispatch:

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codice
        uses: actions/checkout@v4

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installa Dipendenze Backend
        run: |
          cd backend-bot
          npm install

      - name: Esegui Sincronizzazione Roster Cloud
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          cd backend-bot
          node updater.js